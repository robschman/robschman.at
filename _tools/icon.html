<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Symbol</title>
<!--
  Vorlage fuer favicon-32.png und apple-touch-icon.png.
  Es ist die quadratische Variante der Wortmarke, die das Design-System fuer
  kleine Groessen vorschreibt: gruene Kachel, dunkles "rs_".
  Das gestauchte volle Logo waere bei 32 px unleserlich.
  Neu erzeugen mit:  bash _tools/bilder-erzeugen.sh
-->
<style>
@font-face { font-family:'JetBrains Mono'; font-weight:400 700; font-display:block;
  src:url('../assets/fonts/jetbrains-mono-latin.woff2') format('woff2'); }

html,body { margin:0; padding:0; background:#0B0B0B; }
.icon { width:512px; height:512px; background:#4ADE80; box-sizing:border-box;
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:230px;
  letter-spacing:-.06em; color:#0B0B0B; line-height:1;
  padding-bottom:14px; }
</style>
</head>
<body>
<div class="icon">rp_</div>
</body>
