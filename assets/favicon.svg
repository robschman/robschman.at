<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="robschman programming">
  <!-- Quadratische Variante der Wortmarke: dunkle Kachel, "rp" in Weiss,
       Unterstrich in Terminal-Gruen - wie die grosse Wortmarke auf der Seite.
       Moderne Browser nehmen dieses SVG (immer scharf), aeltere die
       PNG-Fassungen favicon-32.png und apple-touch-icon.png. -->
  <rect width="64" height="64" fill="#0B0B0B"/>
  <text x="32" y="42"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="31" font-weight="700" letter-spacing="-1.8"
        text-anchor="middle" fill="#F5F5F5">rp<tspan fill="#4ADE80">_</tspan></text>
</svg>
