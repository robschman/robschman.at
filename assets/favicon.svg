       favicon-32.png und apple-touch-icon.png. -->
  <rect width="64" height="64" fill="#4ADE80"/>
  <text x="32" y="41"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="29" font-weight="700" letter-spacing="-1.6"
        text-anchor="middle" fill="#0B0B0B">rs_</text>
</svg>
